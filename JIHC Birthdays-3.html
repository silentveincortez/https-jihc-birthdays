<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>JIHC Birthdays</title><meta name="claude:viewport-fit-sides" content="cover"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700;800&display=swap"><style id="app-style">
/* Layout: a red-velvet stage with the college logo lit between two curtains, then a calm dark directory of birthdays below. */
:root{
  --ink:#070405;
  --panel:#150c0f;
  --panel-2:#1e1216;
  --velvet:#b3121c;
  --velvet-hi:#e50914;
  --velvet-btn:#cf0f19;
  --velvet-deep:#4d060d;
  --light:#fff5e8;
  --text:#f4ede8;
  --muted:#b5a7a3;
  --line:rgba(255,235,225,.13);
  --blue:#4aa3ff;
  --gold:#f0b44c;
  --lilac:#b9acec;
  --display:'Montserrat',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--ink);color:var(--text);font:15px/1.55 var(--body);-webkit-text-size-adjust:100%}
body.hasbar{padding-bottom:84px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:50;background:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{width:100%;max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo .cls-1{fill:#1a1a1a}
.logo .cls-2{fill:#07f}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:rgba(7,4,5,.86);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:9px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.badge{width:42px;height:42px;border-radius:50%;background:var(--light);display:grid;place-items:center;flex:none}
.badge .logo{width:36px;height:36px}
.brand b{font:800 16px var(--display);letter-spacing:.2em}
.lang{display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:999px;flex:none}
.lang button{min-height:34px;min-width:46px;padding:0 10px;border:0;border-radius:999px;background:transparent;color:var(--muted);font:700 12px var(--display);letter-spacing:.12em;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--velvet-btn);color:#fff}
.lang button:focus-visible,.btn:focus-visible,.chip-b:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--velvet-hi);outline-offset:2px}

/* stage */
.stage{position:relative;height:clamp(560px,88svh,860px);overflow:hidden;background:#000;isolation:isolate;--open:38%}
.floor{position:absolute;left:0;right:0;bottom:0;height:170px;z-index:1;background:radial-gradient(70% 100% at 50% 0%,rgba(229,9,20,.6),rgba(229,9,20,.14) 55%,transparent 82%)}
.aperture{position:absolute;left:50%;bottom:120px;width:min(48vw,440px);height:calc(100% - 190px);transform:translateX(-50%);z-index:1;background:linear-gradient(0deg,rgba(255,240,222,.95),rgba(255,240,222,.4) 45%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 28%,#000 72%,transparent);mask-image:linear-gradient(90deg,transparent,#000 28%,#000 72%,transparent);animation:glow 2s ease .8s both}
.curtain{position:absolute;top:0;bottom:0;z-index:2;width:var(--open);animation:open 2.4s cubic-bezier(.7,0,.2,1) .35s both}
.curtain.l{left:0;clip-path:polygon(0 0,100% 0,82% 100%,0 100%);background:
  repeating-linear-gradient(90deg,rgba(0,0,0,.42) 0,rgba(0,0,0,0) 12px,rgba(255,130,130,.12) 22px,rgba(0,0,0,.3) 36px,rgba(0,0,0,.42) 46px),
  linear-gradient(180deg,rgba(0,0,0,.6),rgba(0,0,0,0) 30%,rgba(0,0,0,0) 78%,rgba(0,0,0,.4)),
  linear-gradient(90deg,var(--velvet-deep),var(--velvet) 62%,var(--velvet-hi))}
.curtain.r{right:0;clip-path:polygon(0 0,100% 0,100% 100%,18% 100%);background:
  repeating-linear-gradient(90deg,rgba(0,0,0,.42) 0,rgba(0,0,0,0) 12px,rgba(255,130,130,.12) 22px,rgba(0,0,0,.3) 36px,rgba(0,0,0,.42) 46px),
  linear-gradient(180deg,rgba(0,0,0,.6),rgba(0,0,0,0) 30%,rgba(0,0,0,0) 78%,rgba(0,0,0,.4)),
  linear-gradient(270deg,var(--velvet-deep),var(--velvet) 62%,var(--velvet-hi))}
.center{position:relative;z-index:3;height:100%;display:grid;grid-template-rows:auto 1fr auto;justify-items:center;align-items:center;padding-block:34px 44px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));text-align:center}
.kicker{margin:0;padding-left:.55em;font:600 12px var(--display);letter-spacing:.55em;text-transform:uppercase;color:#ddd3ce;animation:fade 1.2s ease 1.5s both}
.disc{width:clamp(210px,30vw,340px);aspect-ratio:1;max-width:100%;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 38%,#fff,#fff6ea 62%,#ffe4c4);box-shadow:0 0 0 1px rgba(255,255,255,.4),0 0 90px 18px rgba(255,236,214,.42),0 0 220px 60px rgba(255,200,150,.2);animation:rise 1.6s ease .9s both}
.disc .logo{width:93%;height:93%}
.tag{margin:0;font:500 clamp(20px,3.2vw,30px)/1.25 var(--body);color:#fff;text-shadow:0 2px 28px #000;animation:fade 1.2s ease 1.7s both}
.tag em{font-style:normal;color:var(--velvet-hi)}
@keyframes open{from{width:52%}to{width:var(--open)}}
@keyframes glow{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (max-width:700px){.stage{--open:24%}.kicker{letter-spacing:.4em}}
@media (prefers-reduced-motion:reduce){.curtain,.aperture,.disc,.kicker,.tag{animation:none!important}}

/* sections */
.sec{padding-block:48px 0}
.eyebrow{font:700 12px var(--display);letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
.h2{margin:0 0 18px;font:800 clamp(24px,4vw,34px)/1.1 var(--display);letter-spacing:-.01em;text-wrap:balance}
.big{margin:10px 0 14px;font:800 clamp(28px,5vw,44px)/1.1 var(--display);letter-spacing:-.01em;text-wrap:balance}
.muted{color:var(--muted)}
.nextline{margin:0;color:var(--muted)}
.nextline b{color:var(--text);font-weight:600}
.today-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:14px;margin-top:16px}
.tcard{position:relative;overflow:hidden;padding:24px 22px 22px;border-radius:14px;border:1px solid rgba(229,9,20,.55);background:linear-gradient(180deg,#2b0b10,#170a0d);display:flex;flex-direction:column;gap:10px;min-width:0}
.tcard::before{content:"";position:absolute;left:10%;right:10%;top:-60%;height:130%;background:radial-gradient(closest-side,rgba(255,236,214,.2),transparent);pointer-events:none}
.tcard>*{position:relative}
.tcard .hb{font:700 12px var(--display);letter-spacing:.26em;text-transform:uppercase;color:var(--velvet-hi)}
.tcard h3{margin:0;font:800 clamp(22px,3vw,28px)/1.15 var(--display);overflow-wrap:anywhere}
.tcard p{margin:0;color:var(--muted)}
.tcard .chips-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:10px}
.card{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.card.is-today{border-color:rgba(229,9,20,.7);background:#220b10}
.dn{display:flex;flex-direction:column;align-items:center;line-height:1}
.dn b{font:800 26px var(--display);font-variant-numeric:tabular-nums}
.dn span{margin-top:4px;font:600 10px var(--display);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.is-soon .dn b,.is-today .dn b{color:var(--velvet-hi)}
.who{min-width:0}
.who h4{margin:0;font:600 15px/1.3 var(--body);overflow-wrap:anywhere}
.who p{margin:2px 0 0;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.meta{display:flex;flex-direction:column;align-items:flex-end;gap:6px;text-align:right}
.when{font-size:12px;color:var(--muted);white-space:nowrap}
.is-today .when{color:var(--velvet-hi);font-weight:600}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;font:600 11px var(--body);letter-spacing:.02em;border:1px solid currentColor;white-space:nowrap}
.t-student{color:var(--blue)}
.t-teacher{color:var(--gold)}
.t-staff{color:var(--lilac)}
.acts{display:flex;gap:6px}
.acts button{min-height:30px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);color:var(--text);font-size:12px;cursor:pointer}
.acts button.del{color:#ff8a8a}
.ctl{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:6px}
.ctl input[type="search"]{flex:1 1 240px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip-b{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font:600 13px var(--body);cursor:pointer}
.chip-b i{font-style:normal;margin-left:6px;opacity:.7;font-variant-numeric:tabular-nums}
.chip-b[aria-pressed="true"]{background:var(--text);color:var(--ink);border-color:var(--text)}
.mh{display:flex;align-items:baseline;gap:12px;margin:34px 0 12px}
.mh h3{margin:0;font:800 clamp(24px,4.5vw,36px)/1 var(--display);text-transform:uppercase;letter-spacing:.01em}
.mh span{color:var(--muted);font:600 13px var(--body);font-variant-numeric:tabular-nums}
.mh.cur h3{color:var(--velvet-hi)}
.empty{padding:40px 22px;border:1px dashed var(--line);border-radius:14px;text-align:center;color:var(--muted)}
.empty p{margin:0;max-width:46ch;margin-inline:auto}

/* admin */
.admin{margin-top:28px;padding:20px;border-radius:14px;border:1px dashed rgba(229,9,20,.65);background:var(--panel)}
.admin-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.pill{padding:4px 12px;border-radius:999px;background:var(--velvet-btn);color:#fff;font:700 11px var(--display);letter-spacing:.18em;text-transform:uppercase}
.admin h3{margin:0;font:700 16px var(--display)}
.fields{display:grid;gap:12px}
.f3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,130px),1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:6px;font:600 12px var(--body);color:var(--muted);min-width:0}
input,select,textarea{width:100%;min-height:44px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#0d0709;color:var(--text)}
textarea{min-height:110px;resize:vertical;line-height:1.5}
.err{min-height:20px;margin:0;color:#ff8a8a;font-size:13px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:#261519;color:var(--text);font:600 14px var(--body);cursor:pointer}
.btn.primary{background:var(--velvet-btn);border-color:var(--velvet-btn);color:#fff}
.btn[disabled]{opacity:.6;cursor:default}
.sep{height:1px;background:var(--line);margin:20px 0}
.help{margin:0 0 10px;color:var(--muted);font-size:13px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:45;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:#1b0b0f;border-top:1px solid rgba(229,9,20,.7)}
.bar-t{font-weight:600}
.bar-b{display:flex;gap:10px}
.foot{padding-block:56px 32px;color:var(--muted);font:600 12px var(--display);letter-spacing:.26em;text-transform:uppercase;text-align:center}

  function renderApp() {

    } else {

  function renderDir() {
    var el = $('#dir');
    if (!el) return;
    var t0 = midnight(), qq = q.trim().toLowerCase();
    var list = people.filter(function (p) {
      return (role === 'all' || p.t === role) && (!qq || (p.n + ' ' + (p.g || '')).toLowerCase().indexOf(qq) > -1);

    if (!list.length) { el.innerHTML = '<p class="muted">' + tr('none') + '</p>'; return; }

        .map(function (p) { return info(p, t0); })
        .sort(function (a, b) { return a.p.d - b.p.d || nameSort(a, b); });
      if (!items.length) continue;

  /* owner: draft and save */
  function dirtyCount() {
    var a = {}, b = {}, c = 0;

    people.forEach(function (p) { b[p.id] = 1; if (a[p.id] !== JSON.stringify(p)) c++; });

  function val(id) { var el = document.getElementById(id); return el ? el.value : ''; }
  function addOne() {
    var name = val('f-name').trim(), d = parseInt(val('f-day'), 10), m = parseInt(val('f-month'), 10), t = val('f-role'), g = val('f-group').trim();
    if (!name) { formErr = tr('errName'); return renderApp(); }
    if (!(m >= 1 && m <= 12) || !(d >= 1 && d <= DIM[m - 1])) { formErr = tr('errDate'); return renderApp(); }
    formErr = ''; bulkMsg = '';

      people = people.map(function (p) { return p.id === editingId ? { id: p.id, n: name, m: m, d: d, t: t, g: g } : p; });

  function parseRole(s) {
    s = (s || '').toLowerCase();
    if (/мұғал|преп|учит|teach|оқыт/.test(s)) return 'teacher';
    if (/қызмет|сотруд|staff|персонал|әкімш|админ|admin/.test(s)) return 'staff';
    return 'student';
  }
  function isRoleWord(s) { return /мұғал|преп|учит|teach|оқыт|қызмет|сотруд|staff|персонал|әкімш|админ|admin|студент|student|оқушы|обуч/i.test(s); }
  function parseDate(s) {
    var m = s.match(/^\s*\d{4}-(\d{1,2})-(\d{1,2})/);
    if (m) return { m: +m[1], d: +m[2] };
    m = s.match(/^\s*(\d{1,2})[.\-\/](\d{1,2})(?:[.\-\/]\d{2,4})?\s*$/);
    return m ? { m: +m[2], d: +m[1] } : null;
  }
  function bulkAdd() {
    var lines = val('f-bulk').split(/\r?\n/), a = 0, s = 0;
    lines.forEach(function (line) {
      if (!line.trim()) return;
      var parts = (line.indexOf(';') > -1 || line.indexOf('\t') > -1 ? line.split(/[;\t]/) : line.split(',')).map(function (x) { return x.trim(); });
      var name = parts[0], dt = null, t = null, g = [], i;
      for (i = 1; i < parts.length; i++) {
        if (!parts[i]) continue;
        if (!dt && parseDate(parts[i])) dt = parseDate(parts[i]);
        else if (!t && isRoleWord(parts[i])) t = parseRole(parts[i]);
        else g.push(parts[i]);
      }
      if (!name || !dt || !(dt.m >= 1 && dt.m <= 12) || !(dt.d >= 1 && dt.d <= DIM[dt.m - 1])) { s++; return; }
      var dup = people.some(function (p) { return p.n.toLowerCase() === name.toLowerCase() && p.m === dt.m && p.d === dt.d; });
      if (dup) { s++; return; }
      people.push({ id: uid(), n: name, m: dt.m, d: dt.d, t: t || 'student', g: g.join(', ') });
      a++;
    });
    bulkMsg = tr('bulkRes', { a: a, s: s });
    renderApp(); renderBar();
  }

  function onClick(e) {

    else if (act === 'cancel') { editingId = null; formErr = ''; renderApp(); }
    else if (act === 'edit') {
      editingId = id; formErr = ''; renderApp();
      var ad = document.getElementById('admin'); if (ad && ad.scrollIntoView) ad.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
    else if (act === 'del') {
      people = people.filter(function (p) { return p.id !== id; });
      if (editingId === id) editingId = null;
      renderApp(); renderBar();
    }
    else if (act === 'bulk') bulkAdd();
    else if (act === 'discard') { people = clone(saved.people); editingId = null; formErr = ''; bulkMsg = ''; msg = ''; renderApp(); renderBar(); }
    else if (act === 'save') save();
  }

  function renderAll() { renderChrome(); renderApp(); renderBar(); }

  function init() {
    lang = pickLang();
    shell();
    renderAll();
    $('#root').addEventListener('click', onClick);
    $('#root').addEventListener('input', function (e) {
      if (e.target && e.target.id === 'q') { q = e.target.value; renderDir(); }
    });
    $('#root').addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && e.target && /^f-(name|day|group)$/.test(e.target.id)) { e.preventDefault(); addOne(); }
    });
    window.addEventListener('hashchange', function () {
      var l = pickLang();
      if (l !== lang) { lang = l; renderAll(); }
    });
    if (window.claude && window.claude.use) {
      Promise.all([window.claude.use('user'), window.claude.use('artifact')]).then(function (r) {
        if (!r[0] || !r[1]) return;
        return r[0].isOwner().then(function (o) {
          if (o) { owner = true; art = r[1]; renderApp(); renderBar(); }
        });
      }).catch(function () {});
    }
  }
  init();
})();
</script></body></html>
